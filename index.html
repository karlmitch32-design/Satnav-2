<style>

/* PRE-DRIVE LAUNCHER */
.topbar{position:absolute;z-index:1200;top:14px;left:14px;right:14px;display:flex;gap:10px;pointer-events:none}.topbar>*{pointer-events:auto}.brand{background:rgba(15,23,17,.94);color:#fff;border:1px solid rgba(201,243,106,.28);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);font-weight:950;letter-spacing:.5px;display:flex;align-items:center;gap:8px;white-space:nowrap}.brand-mark{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--lime);color:#172019;font-size:15px}.searchbox{flex:1;display:flex;align-items:center;gap:4px;background:rgba(250,252,247,.97);padding:3px 5px;border-radius:11px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.65);min-height:38px}.searchbox input{flex:1;border:0;outline:0;padding:5px 5px;min-width:0;background:transparent;font-weight:650;font-size:14px}.searchbox button{background:var(--nav2);padding:7px 10px;border-radius:9px;font-size:11px}.search-icon{font-size:19px;color:#536152;padding-left:4px}

.instruction{position:absolute;top:68px;left:12px;right:12px;margin:0;background:linear-gradient(135deg,rgba(9,15,11,.94),rgba(24,38,28,.91));color:#fff;border:1px solid rgba(201,243,106,.28);border-radius:20px;box-shadow:var(--shadow);min-height:104px;padding:12px 15px;display:flex;align-items:center;gap:13px;border-left:5px solid var(--lime);backdrop-filter:blur(14px)}.arrow{font-size:58px;line-height:1;color:var(--lime);width:78px;min-width:78px;text-align:center;font-weight:950;text-shadow:0 0 18px rgba(201,243,106,.2)}.roundabout-svg{width:88px;height:88px;overflow:visible}.roundabout-svg .ring{fill:rgba(255,255,255,.03);stroke:#d8e0d5;stroke-width:9}.roundabout-svg .road{fill:none;stroke:#78877a;stroke-width:5;stroke-linecap:round}.roundabout-svg .active{stroke:var(--cyan);stroke-width:8;filter:drop-shadow(0 0 5px var(--cyan))}.roundabout-svg text{font-size:9px;font-weight:950;fill:#fff}.ins-main{flex:1;min-width:0}.ins-main .big{font-size:23px;font-weight:950;line-height:1.05;text-transform:uppercase;letter-spacing:.2px}.ins-main .sub{font-size:12px;color:#aeb8ad;margin-top:6px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.distance{font-size:27px;font-weight:950;white-space:nowrap;color:var(--lime)}
.routebar{position:absolute;top:181px;left:12px;right:12px;margin:0;background:rgba(7,12,9,.82);color:#fff;border:1px solid rgba(255,255,255,.11);border-radius:13px;box-shadow:var(--shadow);padding:8px 12px;display:flex;gap:14px;align-items:center;overflow:hidden;backdrop-filter:blur(10px)}.routebar span{font-size:10px;white-space:nowrap}.routebar b{font-size:12px}.routebar .nextroad{font-weight:850;flex:1;overflow:hidden;text-overflow:ellipsis;color:#dce5da}
.bottom{position:absolute;z-index:1300;left:10px;right:10px;bottom:8px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.bottom>*{pointer-events:auto}.stats{display:flex;align-items:center;gap:0;background:rgba(8,13,10,.9);color:#fff;border:1px solid rgba(255,255,255,.13);padding:3px;border-radius:13px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}.stat{min-width:68px;padding:4px 7px;border-right:1px solid rgba(255,255,255,.12)}.stat:last-child{border-right:0}.stat b{display:block;font-size:16px}.stat.limit b{font-size:18px;color:var(--lime)}.stat.limit.over b{color:var(--danger)}.stat small{color:#9da99c;font-size:8px;font-weight:800;letter-spacing:.7px}.controls{display:flex;gap:8px}.round{width:42px;height:42px;padding:0;border-radius:15px;box-shadow:var(--shadow);background:rgba(8,13,10,.9);border:1px solid rgba(255,255,255,.13);color:#fff;font-size:20px}
.speed-warning{display:none;position:absolute;z-index:1450;top:181px;left:50%;transform:translateX(-50%);background:var(--danger);color:#fff;border-radius:13px;padding:10px 15px;box-shadow:var(--shadow);font-weight:950;border:1px solid rgba(255,255,255,.35)}.speed-warning.show{display:block}.junction-state{display:none;position:absolute;z-index:1450;top:225px;left:50%;transform:translateX(-50%);background:rgba(7,12,9,.94);color:#fff;border:1px solid var(--cyan);border-radius:12px;padding:8px 13px;box-shadow:0 0 20px rgba(72,229,255,.18);font-weight:900;text-align:center;min-width:190px}.junction-state.show{display:block}.panel{position:absolute;z-index:1400;left:12px;right:12px;bottom:74px;background:#fff;border-radius:18px;padding:14px;box-shadow:var(--shadow);max-height:62%;overflow:auto;display:none}.panel.show{display:block}.small{font-size:12px;color:#667164;line-height:1.45}.notice{background:#f3f6ee;border:1px solid #dce3d5;padding:10px;border-radius:11px;margin-top:9px}.item{padding:11px 0;border-bottom:1px solid #e4e8e0}.actions{display:flex;gap:7px;margin-top:9px}.actions button{flex:1}.row{display:flex;gap:7px}.row>*{flex:1}.toast{position:absolute;z-index:1500;left:50%;transform:translateX(-50%);bottom:82px;background:#111912;color:#fff;padding:10px 15px;border-radius:13px;box-shadow:var(--shadow);display:none;font-weight:800;border:1px solid rgba(201,243,106,.22)}.toast.show{display:block}.menu{position:absolute;z-index:1401;right:12px;bottom:74px;background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:7px;display:none;width:220px}.menu.show{display:block}.menu button{width:100%;margin:2px 0;text-align:left;background:#fff;color:var(--ink)}.menu button:hover{background:#edf2e9}

/* REDLINE LAUNCH SCREEN — shown before the live map */
#redlineLaunch{position:absolute;inset:0;z-index:3000;background:linear-gradient(180deg,#050505,#0b0507);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;color:#fff}
#redlineLaunch .rl-logo{font-size:38px;font-weight:950;letter-spacing:-2px;text-shadow:0 0 8px rgba(255,23,63,.8),0 0 28px rgba(255,23,63,.45)}
#redlineLaunch .rl-logo span{color:#ff173f}.rl-tag{margin-top:6px;color:#8c8c94;font-size:12px;letter-spacing:2px;text-transform:uppercase}.rl-orb{width:126px;height:126px;border-radius:50%;margin:34px 0 27px;border:1px solid #ff284d;box-shadow:0 0 18px rgba(255,23,63,.5),inset 0 0 28px rgba(255,23,63,.12);display:grid;place-items:center;position:relative}.rl-orb:before{content:"";width:66px;height:66px;border-radius:50%;border:2px solid #ff173f;box-shadow:0 0 24px #ff173f;animation:rlOrbPulse 1.8s infinite}.rl-orb:after{content:"";position:absolute;width:6px;height:6px;background:#fff;border-radius:50%;box-shadow:0 0 12px #fff}@keyframes rlOrbPulse{50%{transform:scale(1.16);opacity:.55}}
#redlineLaunch h2{font-size:20px}#redlineLaunch p{margin-top:7px;color:#777780;font-size:12px;max-width:280px;line-height:1.45}.rl-start{margin-top:22px;width:100%;max-width:290px;height:52px;border:0;border-radius:16px;background:#ff173f;color:#fff;font-size:16px;font-weight:900;box-shadow:0 0 25px rgba(255,23,63,.4)}.rl-permission{margin-top:11px;font-size:10px;color:#64646c}
/* Dynamic black-road guidance: generated from the same route geometry as the real map. */
#blackRoadGuide{position:absolute;inset:0;z-index:1150;pointer-events:none;display:none;overflow:hidden}
#blackRoadGuide.live{display:block}
#blackRoadGuide .road-surface{position:absolute;left:50%;bottom:-10%;transform:translateX(-50%);width:82%;height:82%;background:linear-gradient(90deg,rgba(5,5,7,.78),rgba(20,20,24,.94) 50%,rgba(5,5,7,.78));clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);border-left:1px solid rgba(255,255,255,.12);border-right:1px solid rgba(255,255,255,.12);opacity:.9}
#blackRoadPath{fill:none;stroke:#07070a;stroke-width:15;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px rgba(0,0,0,.95))}
#blackRoadEdge{fill:none;stroke:rgba(255,255,255,.18);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#blackRoadCentre{fill:none;stroke:rgba(255,255,255,.28);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:7 12}
#blackRoadGuide .guide-arrow{position:absolute;left:50%;bottom:10%;width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-bottom:42px solid #57ff9a;filter:drop-shadow(0 0 7px #57ff9a);opacity:.82;transform:translateX(-50%);animation:guidePulse 1.2s ease-in-out infinite}
@keyframes guidePulse{50%{opacity:.48;filter:drop-shadow(0 0 13px #57ff9a)}}
.drive-active .topbar{display:none}.drive-active #mapViewport{filter:saturate(.82) brightness(.96)}.drive-active .leaflet-control-attribution{opacity:.65}.travel-orb{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%,rgba(120,255,190,.95) 0 18%,rgba(20,255,150,.30) 42%,rgba(20,255,150,.08) 68%,transparent 72%);border:2px solid rgba(80,255,170,.95);box-shadow:0 0 7px rgba(50,255,160,.85),0 0 18px rgba(50,255,160,.62),inset 0 0 10px rgba(255,255,255,.32);animation:travelOrbPulse 1.15s ease-in-out infinite}.travel-orb-arrow{font-size:22px;line-height:1;color:#fff;text-shadow:0 0 5px #fff,0 0 10px rgba(50,255,160,.95);transform:translateY(-1px)}@keyframes travelOrbPulse{0%,100%{transform:scale(.92);opacity:.82}50%{transform:scale(1.06);opacity:1}}
.start-pulse{width:24px;height:24px;border-radius:50%;background:rgba(22,131,255,.18);border:3px solid #1683ff;box-shadow:0 0 8px rgba(22,131,255,.55);animation:mukPulse 1.15s ease-in-out infinite}@keyframes mukPulse{0%,100%{transform:scale(.72);opacity:.55}50%{transform:scale(1.15);opacity:1}}.pro-route{filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}.road-alert{display:none;position:absolute;z-index:1450;left:50%;transform:translateX(-50%);top:225px;background:#fff5d9;color:#6b4b00;border:2px solid #e3bd52;border-radius:12px;padding:9px 13px;box-shadow:var(--shadow);font-weight:900}.road-alert.show{display:block}
.safety-badge{position:absolute;z-index:1450;left:12px;right:12px;top:275px;display:none;justify-content:center;pointer-events:none}.safety-badge.show{display:flex}.safety-badge span{max-width:min(92vw,520px);background:rgba(7,12,9,.94);color:#fff;border:1px solid rgba(201,243,106,.38);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow);font-size:11px;font-weight:900;text-align:center}.camera-alert span{border-color:rgba(255,210,80,.7)}.weather-alert span{border-color:rgba(72,229,255,.65)}
@media(max-width:520px){.cockpit-brand span:last-child{display:none}.cockpit-brand{padding:7px}.destination-chip{padding:6px 9px}.instruction{top:64px;min-height:96px;padding:9px 11px;gap:8px}.arrow{font-size:48px;width:61px;min-width:61px}.roundabout-svg{width:74px;height:74px}.ins-main .big{font-size:19px}.ins-main .sub{font-size:10px}.distance{font-size:23px}.routebar{top:164px}.stats{max-width:calc(100% - 54px);overflow:hidden}.stat{min-width:64px;padding:4px 7px}.stat:nth-child(3){display:none}.stat b{font-size:14px}.stat.limit b{font-size:16px}.bottom{bottom:9px}.round{width:43px;height:43px}}

/* V57 VISUAL COCKPIT LAYER — visual refresh only; navigation engine unchanged */
.visual-speed-panel{position:absolute;top:14px;right:14px;z-index:1400;display:none;flex-direction:column;align-items:center;gap:7px;pointer-events:none}.drive-active .visual-speed-panel{display:flex}.visual-speed-hud{width:78px;height:78px;border-radius:18px;background:rgba(15,23,42,.94);border:2px solid rgba(255,255,255,.22);box-shadow:0 8px 24px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}.visual-speed-hud.over{border-color:var(--danger);background:rgba(120,20,25,.94);animation:v57pulse 1s infinite alternate}.visual-speed-value{font-size:30px;font-weight:950;line-height:1}.visual-speed-unit{font-size:9px;color:#aeb8ad;font-weight:900;letter-spacing:1px;margin-top:3px}.visual-speed-hud.over .visual-speed-unit{color:#ffd0d2}.visual-speed-sign{width:46px;height:46px;border-radius:50%;background:#fff;border:5px solid #dc2626;color:#111;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:950;box-shadow:0 5px 14px rgba(0,0,0,.4)}.visual-speed-sign.unknown{font-size:15px;color:#555}.drive-active .instruction{right:102px}.drive-active .cockpit-head{right:102px}.drive-active .routebar{right:102px}.drive-active .speed-warning{max-width:calc(100% - 120px);text-align:center}@keyframes v57pulse{from{box-shadow:0 0 8px rgba(255,77,85,.35)}to{box-shadow:0 0 22px rgba(255,77,85,.75)}}
@media(max-width:520px){.visual-speed-panel{top:10px;right:10px}.visual-speed-hud{width:68px;height:68px}.visual-speed-value{font-size:27px}.visual-speed-sign{width:42px;height:42px;font-size:17px}.drive-active .instruction{right:88px}.drive-active .cockpit-head{right:88px}.drive-active .routebar{right:88px}}

/* V61 PHONE-FIT PRODUCTION LAYOUT
   Responsive containment only: navigation engine, route logic, GPS, voice and camera remain intact. */
html,body,#app{width:100%;min-width:0;max-width:100%;overflow:hidden}
#app{position:relative;isolation:isolate}
.topbar{max-width:100%;min-width:0}
.topbar .brand{flex:0 0 auto;min-width:0}
.topbar .searchbox{min-width:0}
.searchbox input{width:100%;max-width:100%}
.drive-ui{min-width:0;max-width:100%;overflow:hidden}
.cockpit-head,.instruction,.routebar,.bottom{max-width:calc(100% - 24px)}
.cockpit-head>*{min-width:0}
.destination-chip{min-width:0}
.visual-speed-panel{max-width:76px}
.stats{min-width:0;max-width:100%}
.stat{min-width:0;flex:1 1 0;text-align:center}
.controls{flex:0 0 auto}

  .drive-active .cockpit-head{top:max(8px,env(safe-area-inset-top));left:8px;right:78px;gap:5px}

  .drive-active .cockpit-brand .brand-mark{width:25px;height:25px}
  .drive-active .destination-chip{padding:5px 8px;border-radius:11px}

  .bottom .stat small{font-size:6px;letter-spacing:.35px;white-space:nowrap}
  .bottom .controls{position:absolute;right:0;bottom:0;display:flex;gap:5px}
  .round{width:42px;height:42px;border-radius:13px;font-size:18px}

  .speed-warning{top:132px;left:8px;right:78px;transform:none;max-width:none!important;padding:7px 8px;font-size:10px;border-radius:10px}
  .junction-state{top:132px;left:8px;right:78px;transform:none;min-width:0;padding:6px 8px;font-size:10px}

function cameraCenterFor(p,h){

  document.getElementById('blackRoadCentre').setAttribute('d',d);
  const arrow=box.querySelector('.guide-arrow');
  if(arrow){
    const routeNext=routePointAhead(p,55);
    const ah=routeNext?bearing(p,routeNext):h;
    const rel=((ah-h+540)%360)-180;
    arrow.style.transform=`translateX(-50%) rotate(${Math.max(-42,Math.min(42,rel))}deg)`;
  }
  box.classList.add('live');
}
function startTracking(){document.getElementById('redlineLaunch')?.classList.add('hidden');if(!navigator.geolocation)return;if(watchId!==null)navigator.geolocation.clearWatch(watchId);requestWakeLock();watchId=navigator.geolocation.watchPosition(onPosition,onPositionError,{enableHighAccuracy:true,maximumAge:1000,timeout:10000});toast('Live navigation started')}
function stopNavigation(){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}driveMode=false;if(routeGlowLayer){map.removeLayer(routeGlowLayer);routeGlowLayer=null}document.getElementById('blackRoadGuide')?.classList.remove('live');hide();document.body.classList.remove('drive-active');UI.style.display='none';ST.style.display='none';INS.classList.remove('show');RB.classList.remove('show');LANE.classList.remove('show');document.getElementById('speedWarning').classList.remove('show');resetRoadAlert();const vp=document.getElementById('mapViewport');const me=document.getElementById('map');if(vp)vp.style.transform='none';if(me)me.style.transform='none';if(wakeLock){try{wakeLock.release()}catch(e){}wakeLock=null}if('speechSynthesis'in window)speechSynthesis.cancel();toast('Navigation stopped')}
function toggleOrientation(){orientationMode=orientationMode==='heading'?'north':'heading';const b=document.getElementById('orientBtn');if(b)b.textContent=orientationMode==='heading'?'▲':'N';if(lastPos){const near=nearestOnRoute(lastPos);const h=orientationMode==='heading'?(stableNavigationHeading(lastPos,near)??routeBearingAt(near.index)):0;setMapRotation(h??0);map.setView(cameraCenterFor(lastPos,h??0),17,{animate:false});}toast(orientationMode==='heading'?'Driving camera enabled':'North-up map enabled')}
function recenter(){if(lastPos){const near=nearestOnRoute(lastPos);const h=orientationMode==='heading'?(stableNavigationHeading(lastPos,near)??routeBearingAt(near.index)):0;updateDrivingCamera(lastPos,near,true);if(orientationMode==='north')map.setView([lastPos.lat,lastPos.lon],17,{animate:false});}}
function onPositionError(e){if(e.code===1)toast('Allow Location for MUK SATNAV 86');else toast('GPS signal unavailable')}
async function onPosition(pos){
 const p={lat:pos.coords.latitude,lon:pos.coords.longitude};p.accuracy=pos.coords.accuracy||999;p.speed=Number.isFinite(pos.coords.speed)?Math.max(0,pos.coords.speed):0;
 const rawHeading=Number.isFinite(pos.coords.heading)&&pos.coords.heading>=0?pos.coords.heading:headingFromMotion(p);
 p.heading=rawHeading;
 const near=nearestOnRoute(p); const snapped=(near.point&&near.d<100)?near.point:{lat:p.lat,lon:p.lon};
 // The vehicle marker is always tied to the route geometry when a route is active.
 p.snapped=snapped; p.routeIndex=near.index;
 if(!myMarker)myMarker=L.marker([snapped.lat,snapped.lon],{icon:carIcon(),zIndexOffset:1000}).addTo(map);else myMarker.setLatLng([snapped.lat,snapped.lon]);
 const markerEl=myMarker.getElement?.(); if(markerEl){markerEl.style.zIndex='2000';}
 const prev=lastPos; lastPos=p;
 if(prev&&hav(prev,p)<1.2 && p.speed<1.5) p.speed=0;
 updateDrivingCamera(snapped,near);
 updateBlackRoadGuide(p,near);
 updateStartPulse(p);updateRouteColour(p);requestWakeLock();
 await Promise.allSettled([speedLimitCheck(p),checkUpcomingSpeedChange(p),checkTrafficLights(p),checkSafetyData(p)]);routeGeometryHazards(p);updateStats(p);
 if(!routeSteps.length)return;await navigationEngine(p);
}

function isRoundaboutStep(st){const t=st?.maneuver?.type||'';return t==='roundabout'||t==='rotary'||t==='exit roundabout';}
function routeIndexForManeuver(st){return Number.isFinite(st?._routeIndex)?st._routeIndex:null}
function hasPassedManeuver(p,st){
 const target=maneuverProgress(st);if(target==null)return false;
 return routeProgress(p)>target+12;
}
function sameJunctionAfterRoundabout(index){
 const prev=routeSteps[index-1],cur=routeSteps[index];
 if(!prev||!cur||!isRoundaboutStep(prev))return false;
 const a=prev.maneuver?.location,b=cur.maneuver?.location;
 if(!a||!b)return false;
 return hav({lat:a[1],lon:a[0]},{lat:b[1],lon:b[0]})<75;
}
function isHighwayLike(st){const ref=String(st?.ref||'').toUpperCase();const n=String(st?.name||'').toLowerCase();return /\b(M\d+|A\d+\(M\)|A\d+)\b/.test(ref)||/motorway|dual carriageway|trunk/.test(n);}
function stepHighwayTransition(prev,cur,next){
 const a=prev?.maneuver||{},b=cur?.maneuver||{},c=next?.maneuver||{};
 const bt=b.type||'', bm=b.modifier||'';
 if(bt==='fork')return bm==='left'?'Keep left':'Keep right';
 if(bt==='merge')return bm==='left'?'Merge left':'Merge right';
 if(bt==='on ramp')return bm==='left'?'Keep left and take the slip road':bm==='right'?'Keep right and take the slip road':'Take the slip road';
 if(bt==='off ramp')return bm==='left'?'Keep left and take the slip road':bm==='right'?'Keep right and take the slip road':'Take the slip road';
 if(bt==='continue' && isHighwayLike(cur)){
  if(next&&(next.maneuver?.type==='off ramp'||next.maneuver?.type==='on ramp'))return next.maneuver?.modifier==='left'?'Keep left for the slip road':'Keep right for the slip road';
 }
 return null;
}
function junctionVoiceForStep(st,index){
 const t=st?.maneuver?.type||'',m=st?.maneuver?.modifier||'';
 if(t==='fork')return m==='left'?'Keep left.':'Keep right.';
 if(t==='merge')return m==='left'?'Merge left.':'Merge right.';
 if(t==='on ramp')return m==='left'?'Keep left and take the slip road.':m==='right'?'Keep right and take the slip road.':'Take the slip road.';
 if(t==='off ramp')return m==='left'?'Keep left and leave the motorway.':m==='right'?'Keep right and leave the motorway.':'Take the motorway exit.';
 if(t==='continue' && isHighwayLike(st)){
  const n=routeSteps[index+1];if(n?.maneuver?.type==='off ramp')return 'Keep left to leave the motorway.';
  if(n?.maneuver?.type==='on ramp')return 'Keep left for the slip road.';
 }
 if(t==='merge')return m==='left'?'Merge onto the road.':'Merge onto the road.';
 return null;
}
function enrichStep(st,index){
 const t=st?.maneuver?.type||'',m=st?.maneuver?.modifier||'';
 const n=routeSteps[index+1],prev=routeSteps[index-1];
 const transition=junctionVoiceForStep(st,index)||stepHighwayTransition(prev,st,n);
 if(transition)st._commercialInstruction=transition;
 if(t==='merge' && n?.ref)st._commercialInstruction=(m==='left'?'Merge left onto ':'Merge right onto ')+n.ref+'.';
 if((t==='on ramp'||t==='off ramp')&&n?.ref)st._commercialRoadRef=n.ref;
 return st;
}
function commercialInstruction(st,index){return st?._commercialInstruction||junctionVoiceForStep(st,index)||null;}

function navigationEngine(p){
 const near=nearestOnRoute(p);
 if(near.d>65){
   if(!offRouteSince)offRouteSince=Date.now();
   if(Date.now()-offRouteSince>2200&&Date.now()-lastReroute>9000){
     toast('Off route — recalculating'); speak('You are off route. Recalculating.'); lastReroute=Date.now();
     return buildRoute(p,current,true).then(()=>{offRouteSince=0}).catch(()=>toast('Unable to recalculate right now'));
   }
 }else offRouteSince=0;
 const rb=routeBearingAt(near.index);
 if(p.heading!=null&&near.d<50&&rb!=null&&angleDiff(p.heading,rb)>115&&p.speed>2){
   if(!wrongWaySince)wrongWaySince=Date.now();
   if(Date.now()-wrongWaySince>1800&&Date.now()-lastReroute>9000){
     toast('Wrong direction — recalculating'); speak('Wrong direction. Recalculating.'); lastReroute=Date.now();
     return buildRoute(p,current,true).then(()=>{wrongWaySince=0}).catch(()=>{});
   }
 }else wrongWaySince=0;
 let st=routeSteps[stepIndex]; if(!st)return;
 let distTo=distanceToStep(p,st), type=st.maneuver?.type||'';
 // Do not announce a following generic turn as part of the roundabout exit.
 // Advance when the manoeuvre is reached OR when GPS has already carried the
 // vehicle beyond its route geometry. This prevents a missed junction from
 // leaving the navigator stuck on the previous instruction after a GPS jump.
 if(actionableStep(st)&&(distTo<45||hasPassedManeuver(p,st))&&stepIndex<routeSteps.length-1){
   const oldIndex=stepIndex; let guard=0;
   do{
    stepIndex++;guard++;
    while(stepIndex<routeSteps.length-1&&!actionableStep(routeSteps[stepIndex]))stepIndex++;
   }while(stepIndex<routeSteps.length-1&&guard<4&&hasPassedManeuver(p,routeSteps[stepIndex]));
   const n=routeSteps[stepIndex],key='step'+stepIndex;
   if(!announced[key]){announced[key]=1;speak(announcementForStep(n));}
   renderDrive(p); return;
 }
 if(!actionableStep(st)){renderDrive(p);return;}
 const key='warn'+stepIndex;
 // One preparation call and one final call per actual turn/junction.
 // No repeated indicator/turn announcements while continuing on a road.
 const realJunction=isRoundaboutStep(st)||['turn','fork','merge','on ramp','off ramp'].includes(type)||!!commercialInstruction(st,stepIndex);
 if(realJunction && (p.speed||0)>=2.2){
   const mphNow=mph(p.speed);
   const prep=isRoundaboutStep(st)?Math.max(100,Math.min(190,mphNow*4.8)):Math.max(85,Math.min(180,mphNow*4.0));
   const immediate=isRoundaboutStep(st)?Math.max(20,Math.min(34,mphNow*.85)):Math.max(18,Math.min(32,mphNow*.72));
   if(distTo<prep&&!announced[key+'a']){announced[key+'a']=1;speak(preparationForStep(st,distTo));}
   if(distTo<immediate&&!announced[key+'b']){announced[key+'b']=1;speak(immediateForStep(st));}
 }
 renderDrive(p);
 if(type==='arrive'&&distTo<28&&!arrivedAnnounced){arrivedAnnounced=true;speak("Mate, you made it to your destination. Good work!");toast("Mate, you made it to your destination. Good work!");INS.innerHTML=`<div class="arrow">✓</div><div class="ins-main"><div class="big">MATE, YOU MADE IT!</div><div class="sub">Good work — destination reached</div></div><div class="distance">0 yd</div>`;INS.classList.add('show');}
}

function manner(st){return maneuverLabel(st).toLowerCase()}
function mannerRoundabout(st){const ex=st.maneuver?.exit;return ex?`take the ${ordinal(ex)} exit`:'take the correct exit'}
function preparationForStep(st,d){
 const t=st?.maneuver?.type||'',m=st?.maneuver?.modifier||'',idx=routeSteps.indexOf(st),commercial=commercialInstruction(st,idx);
 if(commercial){if(isRoundaboutStep(st)){const ex=st.maneuver?.exit||st?.exit;if(ex)return `Roundabout ahead in ${formatDistance(d)}. Prepare for the ${ordinal(ex)} exit.`;return `Roundabout ahead in ${formatDistance(d)}.`;}return `${commercial} in ${formatDistance(d)}.`;}
 if(isRoundaboutStep(st)){const ex=st.maneuver?.exit||st?.exit;if(ex)return `Roundabout ahead in ${formatDistance(d)}. Prepare for the ${ordinal(ex)} exit.`;return `Roundabout ahead in ${formatDistance(d)}.`;}
 if(t==='turn')return `${m==='left'?'Left':m==='right'?'Right':'Next'} turn ahead in ${formatDistance(d)}.`;
 return `${m==='left'?'Left':m==='right'?'Right':'Next'} junction ahead in ${formatDistance(d)}.`;
}
function immediateForStep(st){
 const idx=routeSteps.indexOf(st),commercial=commercialInstruction(st,idx),t=st?.maneuver?.type||'',m=st?.maneuver?.modifier||'';
 if(isRoundaboutStep(st)){const ex=st.maneuver?.exit||st?.exit;return ex?`take the ${ordinal(ex)} exit now`:'take the roundabout now';}
 if(commercial)return commercial;
 if(t==='on ramp'||t==='off ramp')return m==='left'?'Keep left and take the slip road now.':m==='right'?'Keep right and take the slip road now.':'Take the slip road now.';
 return `${m==='left'?'Turn left':m==='right'?'Turn right':'Continue ahead'} now.`;
}


function carIcon(){
 const html='<div class="travel-orb" aria-label="Current direction"><div class="travel-orb-arrow">▲</div></div>';
 return L.divIcon({className:'muk-car',html,iconSize:[48,48],iconAnchor:[24,24]});
}
function actionableStep(st){
 const t=st?.maneuver?.type||'';
 return !['depart','arrive','new name'].includes(t);
}
function initialiseActiveStep(p){
 stepIndex=0;
 while(stepIndex<routeSteps.length && !actionableStep(routeSteps[stepIndex])) stepIndex++;
 if(stepIndex>=routeSteps.length) stepIndex=Math.max(0,routeSteps.length-1);
 // If the first actionable step is already behind the starting GPS point, advance once.
 while(stepIndex<routeSteps.length-1){
   const d=distanceToStep(p,routeSteps[stepIndex]);
   if(d>20) break;
   stepIndex++;
 }
 announced={};
}
function announcementForStep(st){
 const idx=routeSteps.indexOf(st),commercial=commercialInstruction(st,idx),t=st?.maneuver?.type||'',m=st?.maneuver?.modifier||'';
 if(t==='roundabout'||t==='rotary')return mannerRoundabout(st);
 if(commercial)return commercial.toLowerCase();
 if(t==='on ramp')return m==='left'?'keep left and take the slip road':m==='right'?'keep right and take the slip road':'take the slip road';
 if(t==='off ramp')return m==='left'?'keep left and leave the motorway':m==='right'?'keep right and leave the motorway':'take the motorway exit';
 return maneuverLabel(st).toLowerCase();
}
function laneMarkup(st){
 const lanes=st?.intersections?.[0]?.lanes;
 if(!Array.isArray(lanes)||!lanes.length)return '';
 const valid=lanes.filter(l=>l?.valid);
 if(!valid.length)return '';
 return '<div class="lane-cue-icon">'+valid.map(l=>{const a=l.indications||[];return a.includes('straight')?'↑':a.includes('slight right')?'↗':a.includes('right')?'→':a.includes('slight left')?'↖':a.includes('left')?'←':'↑'}).join(' ')+'</div><small>USE THE MARKED LANE</small>';
}
function renderDrive(p){
 if(!driveMode||!routeSteps.length)return;
 let st=routeSteps[Math.min(stepIndex,routeSteps.length-1)];
 // Skip non-actionable steps so the display never sits on a useless "continue" instruction.
 while(st && !actionableStep(st) && stepIndex<routeSteps.length-1){stepIndex++;st=routeSteps[stepIndex];}
 if(!st){INS.classList.remove('show');RB.classList.remove('show');LANE.classList.remove('show');return;}
 const d=distanceToStep(p,st), t=st.maneuver?.type||'', text=maneuverLabel(st);
 // Keep the large instruction hidden until the manoeuvre is genuinely approaching.
 const visible=d<=750 || t==='arrive';
 if(!visible){INS.classList.remove('show');RB.classList.remove('show');LANE.classList.remove('show');return;}
 INS.innerHTML=`<div class="arrow">${maneuverArrow(st)}</div><div class="ins-main"><div class="big">${esc(text)}</div><div class="sub">${esc(roadName(st)||'Follow the route')}</div></div><div class="distance">${esc(formatDistance(d))}</div>`;
 INS.classList.add('show');
 RB.innerHTML=`<span class="nextroad">${esc(roadName(st)||'Next manoeuvre')}</span><span><b>${esc(formatDistance(d))}</b></span>`;
 RB.classList.add('show');
 const lm=laneMarkup(st);
 if(lm&&d<450){LANE.innerHTML=lm;LANE.classList.add('show')}else if(commercialInstruction(st,routeSteps.indexOf(st))&&d<450){LANE.innerHTML=`<div class="lane-cue-icon">${t==='off ramp'||t==='on ramp'||t==='fork'?'↙':'↗'}</div><small>JUNCTION GUIDANCE</small>`;LANE.classList.add('show')}else LANE.classList.remove('show');
}
function roundaboutGraphic(st){
 const ex=Math.max(1,Number(st?.maneuver?.exit||st?.exit||1));
 const count=Math.max(4,Math.min(6,ex+1));
 let paths='',labels='';
 for(let i=1;i<=count;i++){
  const angle=-45+(i-1)*45,rad=angle*Math.PI/180,x=50+40*Math.cos(rad),y=50+40*Math.sin(rad),active=i===ex;
  paths+=`<path class="road ${active?'active':''}" d="M50 50 L${x.toFixed(1)} ${y.toFixed(1)}"/>`;
  labels+=`<text x="${(x+(x-50)*.22).toFixed(1)}" y="${(y+(y-50)*.22+3).toFixed(1)}">${i}</text>`;
 }
 return `<svg class="roundabout-svg" viewBox="0 0 100 100" aria-label="Roundabout exit ${ex}"><circle class="ring" cx="50" cy="50" r="22"/>${paths}${labels}<path class="active" d="M50 82 L50 66"/></svg>`;
}
function maneuverArrow(st){
 const t=st?.maneuver?.type||'',m=st?.maneuver?.modifier||'';
 if(t==='roundabout'||t==='rotary')return roundaboutGraphic(st);
 if(t==='on ramp'||t==='off ramp')return m==='left'?'↖':m==='right'?'↗':'↑';
 if(m==='left'||m==='sharp left')return '←';
 if(m==='right'||m==='sharp right')return '→';
 if(m==='slight left')return '↖';
 if(m==='slight right')return '↗';
 return '↑';
}

document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')find()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&driveMode)requestWakeLock()});
document.getElementById('redlineStart')?.addEventListener('click',()=>{document.getElementById('redlineLaunch')?.classList.add('hidden');startTracking();});
