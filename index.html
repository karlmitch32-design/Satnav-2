<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>UK satnav</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif}.app{height:100dvh;display:flex;flex-direction:column;background:#050505}
.status{height:34px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;font-size:11px;font-weight:800}.live{color:#55ff99}.off{color:#777}
.search{margin:5px 10px;height:45px;border:1px solid #333;border-radius:13px;background:#151519;display:flex;align-items:center;padding-left:9px;position:relative;z-index:30}.search input{flex:1;background:none;border:0;outline:0;color:#fff;font-size:14px}.search button{height:35px;border:0;border-radius:9px;background:#ff1744;color:#fff;font-weight:900;padding:0 13px}.suggest{display:none;position:absolute;left:10px;right:10px;top:84px;z-index:100;background:#151519;border:1px solid #333;border-radius:10px;overflow:hidden}.suggest button{width:100%;display:block;background:#151519;color:#fff;border:0;border-bottom:1px solid #29292d;text-align:left;padding:10px;font-size:11px}
.dest{margin:0 10px 6px;padding:7px;border:1px solid #29292e;border-radius:12px;background:#111114;display:flex;gap:8px;align-items:center}.dot{width:24px;height:24px;border-radius:8px;background:#ff1744;display:grid;place-items:center;box-shadow:0 0 12px #ff1744}.copy{flex:1;min-width:0}.copy b,.copy span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.copy b{font-size:12px}.copy span{font-size:9px;color:#777;margin-top:2px}.info{text-align:right;color:#ff3858;font-size:10px}.info small{display:block;color:#777}
.map{position:relative;flex:1;min-height:0;margin:0 8px 6px;border:1px solid #29292f;border-radius:17px;overflow:hidden;box-shadow:0 0 22px rgba(255,20,60,.12)}#map{position:absolute;inset:0}.leaflet-control-attribution{font-size:8px!important;background:#000b!important;color:#aaa!important}.man{position:absolute;z-index:20;top:10px;left:50%;transform:translateX(-50%);min-width:170px;text-align:center;padding:6px 9px;background:#050509dd;border:1px solid #333;border-radius:11px}.man b{display:block;color:#ff3858;font-size:17px}.man span{font-size:9px}.sig{position:absolute;right:8px;top:8px;z-index:20;background:#050509dd;border:1px solid #333;border-radius:8px;padding:5px;font-size:8px}.sig b{color:#55ff99}
.stats{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:5px;margin:0 9px 6px}.stat{background:#121216;border:1px solid #29292f;border-radius:11px;text-align:center;padding:6px;min-height:49px}.stat label{display:block;color:#777;font-size:8px}.stat b{font-size:16px}.stat small{color:#777;font-size:8px}.red{color:#ff3858}
.alert{height:30px;margin:0 9px 6px;border:1px solid #4b2028;border-radius:9px;background:#190b0f;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900}.hide{display:none!important}
.controls{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:5px;margin:0 9px 7px}.ctrl{height:41px;border:1px solid #303038;border-radius:11px;background:#151519;color:#fff;font-weight:900}.primary{background:#ff1744;border-color:#ff1744;box-shadow:0 0 16px #ff174455}
.start{position:absolute;inset:0;z-index:200;background:#050505;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.start h1{font-size:37px;text-shadow:0 0 9px #ff1744}.start h1 span{color:#ff1744}.orb{width:105px;height:105px;border:1px solid #ff1744;border-radius:50%;margin:25px;display:grid;place-items:center;box-shadow:0 0 25px #ff174477}.orb:after{content:"";width:55px;height:55px;border:2px solid #ff1744;border-radius:50%;box-shadow:0 0 20px #ff1744;animation:p 1.5s infinite}@keyframes p{50%{transform:scale(1.35);opacity:.3}}.start p{max-width:280px;color:#777;font-size:11px}.start button{width:290px;max-width:90%;height:51px;border:0;border-radius:14px;background:#ff1744;color:#fff;font-weight:900;font-size:16px}
.toast{position:absolute;top:40px;left:15px;right:15px;z-index:300;background:#17171b;border:1px solid #35353c;border-radius:10px;padding:9px;text-align:center;font-size:10px;transform:translateY(-100px);transition:.25s}.show{transform:translateY(0)}
.vehicle{width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:38px solid #18c9ff;filter:drop-shadow(0 0 4px #00aaff) drop-shadow(0 0 12px #00aaff)}.pulse{position:absolute;left:-15px;top:27px;width:30px;height:30px;border:2px solid #00bfff99;border-radius:50%;box-shadow:0 0 15px #00aaff;animation:p 1.4s infinite}.glow{filter:drop-shadow(0 0 5px #00aaff) drop-shadow(0 0 13px #00aaff) drop-shadow(0 0 25px #00aaff)}
</style></head><body><div class="app">
<div class="status"><span id="clock"></span><span id="gps" class="off">GPS OFF</span></div>
<div class="search">⌖ <input id="q" placeholder="Enter postcode or destination"><button id="go">GO</button><div id="suggest" class="suggest"></div></div>
<div class="dest"><div class="dot">●</div><div class="copy"><b id="name">No destination set</b><span id="state">Enter a destination to calculate a route</span></div><div class="info"><b id="eta">--:--</b><small id="distance">--</small></div></div>
<div class="map"><div id="map"></div><div class="man"><b id="instruction">Set a destination</b><span id="manDist">READY</span></div><div class="sig">● <b id="signal">STANDBY</b></div></div>
<div class="stats"><div class="stat"><label>SPEED</label><b id="speed">0</b><small>MPH</small></div><div class="stat"><label>ARRIVAL</label><b id="arrival" class="red">--:--</b><small id="remain">-- remaining</small></div><div class="stat"><label>LIMIT</label><b id="limit">--</b><small>MPH</small></div></div>
<div id="alert" class="alert hide"></div><div class="controls"><button class="ctrl" id="locate">LOCATE</button><button class="ctrl primary" id="start">START GPS</button><button class="ctrl" id="stop">STOP</button></div>
<div id="startScreen" class="start"><h1>UK <span>satnav</span></h1><div class="orb"></div><p>Road-snapped live navigation with continuous route guidance.</p><button id="launch">START GPS</button></div><div id="toast" class="toast"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
"use strict";
const $=id=>document.getElementById(id),S={watch:null,running:false,pos:null,dest:null,route:null,steps:[],snap:null,lastStep:-1,lastVoice:"",lastVoiceAt:0,limit:null,lastLimit:0,audio:null};
const map=L.map("map",{zoomControl:false,preferCanvas:true}).setView([51.5,-.1],13);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:20,attribution:"© OpenStreetMap contributors"}).addTo(map);let glow=null,core=null,vehicle=null,dmarker=null;
function clock(){$("clock").textContent=new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}setInterval(clock,1000);clock();
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").classList.remove("show"),2400)}
function d(a,b,c,e){const R=6371000,p=a*Math.PI/180,q=c*Math.PI/180,A=(c-a)*Math.PI/180,B=(e-b)*Math.PI/180;return 2*R*Math.asin(Math.sqrt(Math.sin(A/2)**2+Math.cos(p)*Math.cos(q)*Math.sin(B/2)**2))}
function br(a,b,c,e){const y=Math.sin((e-b)*Math.PI/180)*Math.cos(c*Math.PI/180),x=Math.cos(a*Math.PI/180)*Math.sin(c*Math.PI/180)-Math.sin(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.cos((e-b)*Math.PI/180);return(Math.atan2(y,x)*180/Math.PI+360)%360}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function fmt(x){return x<1000?Math.round(x)+" m":(x/1609.344).toFixed(1)+" mi"}function time(m){return new Date(Date.now()+m*60000).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}
function speak(t,force=false){if(!("speechSynthesis"in window))return;let n=Date.now();if(!force&&t===S.lastVoice&&n-S.lastVoiceAt<10000)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.98;speechSynthesis.speak(u);S.lastVoice=t;S.lastVoiceAt=n}
function ping(){try{let C=AudioContext||webkitAudioContext;if(!S.audio)S.audio=new C;let o=S.audio.createOscillator(),g=S.audio.createGain();o.frequency.value=900;g.gain.value=.035;o.connect(g);g.connect(S.audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,S.audio.currentTime+.18);o.stop(S.audio.currentTime+.18)}catch(e){}}
async function geo(q){let r=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=gb&q="+encodeURIComponent(q));return r.json()}
function setDest(x){S.dest={lat:+x.lat,lon:+x.lon,name:x.display_name};$("name").textContent=x.display_name.split(",").slice(0,2).join(", ");$("state").textContent=S.pos?"Calculating driving route…":"Destination saved — start GPS";if(dmarker)dmarker.remove();dmarker=L.marker([S.dest.lat,S.dest.lon]).addTo(map);if(S.pos)route()}
async function search(){let q=$("q").value.trim();if(!q)return toast("Enter a destination.");try{let a=await geo(q);if(!a.length)return toast("Destination not found.");$("suggest").style.display="none";setDest(a[0])}catch(e){toast("Search unavailable.")}}
$("go").onclick=search;$("q").onkeydown=e=>{if(e.key==="Enter")search()};$("q").oninput=e=>{clearTimeout(search.t);search.t=setTimeout(async()=>{if(e.target.value.trim().length<3){$("suggest").style.display="none";return}try{let a=await geo(e.target.value),b=$("suggest");b.innerHTML="";a.slice(0,4).forEach(x=>{let v=document.createElement("button");v.textContent=x.display_name;v.onclick=()=>{$("q").value=x.display_name;b.style.display="none";setDest(x)};b.appendChild(v)});b.style.display=a.length?"block":"none"}catch(e){}},400)};
async function route(){if(!S.pos||!S.dest)return;try{let p=S.pos.coords,u=`https://router.project-osrm.org/route/v1/driving/${p.longitude},${p.latitude};${S.dest.lon},${S.dest.lat}?overview=full&geometries=geojson&steps=true`,r=await fetch(u),j=await r.json();if(j.code!=="Ok")throw Error();S.route=j.routes[0];S.steps=S.route.legs.flatMap(x=>x.steps||[]);S.lastStep=-1;draw();$("state").textContent=Math.round(S.route.duration/60)+" min route • road-following guidance";toast("Route ready.");update()}catch(e){toast("Driving route unavailable.")}}
function nearest(){let c=S.route.geometry.coordinates,p=S.pos.coords,b={d:Infinity,i:0,t:0,lat:p.latitude,lon:p.longitude};for(let i=0;i<c.length-1;i++){let a=c[i],z=c[i+1],dx=z[0]-a[0],dy=z[1]-a[1],den=dx*dx+dy*dy,t=den?clamp(((p.longitude-a[0])*dx+(p.latitude-a[1])*dy)/den,0,1):0,lon=a[0]+t*dx,lat=a[1]+t*dy,x=d(p.latitude,p.longitude,lat,lon);if(x<b.d)b={d:x,i,t,lat,lon}}return b}
function along(c,i,t){let x=0;for(let j=0;j<i;j++)x+=d(c[j][1],c[j][0],c[j+1][1],c[j+1][0]);if(i<c.length-1){let a=c[i],z=c[i+1],lat=a[1]+t*(z[1]-a[1]),lon=a[0]+t*(z[0]-a[0]);x+=d(a[1],a[0],lat,lon)}return x}
function draw(){let ll=S.route.geometry.coordinates.map(x=>[x[1],x[0]]);if(glow)glow.remove();if(core)core.remove();glow=L.polyline(ll,{color:"#00aaff",weight:22,opacity:.58,lineCap:"round",lineJoin:"round",className:"glow"}).addTo(map);core=L.polyline(ll,{color:"#19cfff",weight:7,opacity:1,lineCap:"round",lineJoin:"round"}).addTo(map);map.fitBounds(core.getBounds(),{padding:[40,90]})}
function icon(angle){return L.divIcon({className:"",html:`<div class="pulse"></div><div class="vehicle" style="transform:rotate(${angle}deg)"></div>`,iconSize:[40,55],iconAnchor:[20,42]})}
function setVehicle(lat,lon,a){if(!vehicle)vehicle=L.marker([lat,lon],{icon:icon(a),interactive:false,zIndexOffset:1000}).addTo(map);else{vehicle.setLatLng([lat,lon]);vehicle.setIcon(icon(a))}}
function ord(n){n=+n;return n+(n%100>10&&n%100<14?"th":({1:"st",2:"nd",3:"rd"}[n%10]||"th"))}
function stepText(s){let m=s?.maneuver||{},x=m.modifier||"";if(m.type==="arrive")return"Arriving at destination";if(m.type==="roundabout"||m.type==="rotary")return m.exit?`Take ${ord(m.exit)} exit`:"Enter roundabout";if(m.type==="merge")return x==="left"?"Merge left":x==="right"?"Merge right":"Merge";if(m.type==="on ramp")return"Join slip road";if(m.type==="off ramp")return"Take exit";return({left:"Turn left",right:"Turn right","slight left":"Keep left","slight right":"Keep right","sharp left":"Sharp left","sharp right":"Sharp right",straight:"Continue straight"})[x]||"Continue straight"}
function update(){if(!S.pos||!S.route)return;let p=S.pos.coords,c=S.route.geometry.coordinates,n=nearest();S.snap=n;let prog=along(c,n.i,n.t),rem=Math.max(0,S.route.distance-prog),mph=Math.max(0,(p.speed||0)*2.236936);$("distance").textContent=fmt(rem);$("remain").textContent=fmt(rem)+" remaining";$("speed").textContent=Math.round(mph);let mins=mph>3?rem/(mph*1609.344/3600)/60:S.route.duration/60*(rem/S.route.distance);$("eta").textContent=time(mins);$("arrival").textContent=time(mins);
let acc=0,idx=S.steps.length-1;for(let i=0;i<S.steps.length;i++){if(acc+(S.steps[i].distance||0)>=prog-5){idx=i;break}acc+=S.steps[i].distance||0}let st=S.steps[idx],lead=Math.max(0,acc-prog);if(st){$("instruction").textContent=stepText(st);$("manDist").textContent=lead<8?"NOW":fmt(lead);if(idx!==S.lastStep){speak((lead>180?"In "+Math.round(lead/10)*10+" metres, ":"")+stepText(st).toLowerCase());S.lastStep=idx}}
let j=Math.min(n.i+1,c.length-1),rh=br(c[n.i][1],c[n.i][0],c[j][1],c[j][0]),head=(mph>2&&isFinite(p.heading)&&p.heading>=0)?p.heading:rh;setVehicle(n.lat,n.lon,((rh-head+540)%360)-180);center(n.lat,n.lon);limitCheck();speedCheck()}
function center(lat,lon){let pt=map.project([lat,lon],map.getZoom()),want=map.getSize().y*.68;map.panBy([0,want-pt.y],{animate:true,duration:.3})}
function limitCheck(){if(!S.pos||Date.now()-S.lastLimit<20000)return;S.lastLimit=Date.now();let p=S.pos.coords,u=`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(`[out:json][timeout:5];way(around:45,${p.latitude},${p.longitude})["highway"]["maxspeed"];out tags;`)}`;fetch(u).then(r=>r.json()).then(j=>{let a=(j.elements||[]).map(x=>parseFloat(String(x.tags?.maxspeed||"").replace("mph",""))).filter(x=>isFinite(x)&&x>0);S.limit=a.length?Math.round(a[0]):null;$("limit").textContent=S.limit||"--";speedCheck()}).catch(()=>{})}
function speedCheck(){let s=+$("speed").textContent,l=S.limit;if(l&&s>l+2){ping();$("limit").style.color="#ff3858";$("alert").textContent=`SLOW DOWN — ${s} MPH in a ${l} MPH limit`;$("alert").classList.remove("hide")}else{$("limit").style.color="";$("alert").classList.add("hide")}}
function pos(p){S.pos=p;$("gps").textContent="GPS LIVE";$("gps").className="live";$("signal").textContent="LIVE";if(S.dest&&!S.route)route();else if(S.route)update()}
function err(e){$("gps").textContent="GPS ERROR";$("gps").className="off";$("signal").textContent="NO GPS";toast(e.code===1?"Location permission denied.":"GPS signal unavailable.")}
function start(){if(S.running)return toast("GPS already running.");if(!navigator.geolocation)return toast("GPS unavailable.");S.watch=navigator.geolocation.watchPosition(pos,err,{enableHighAccuracy:true,maximumAge:500,timeout:15000});S.running=true;$("startScreen").classList.add("hide");$("start").textContent="NAV LIVE";speak("GPS navigation started",true)}
function stop(){if(S.watch!==null)navigator.geolocation.clearWatch(S.watch);S.watch=null;S.running=false;$("gps").textContent="GPS OFF";$("gps").className="off";$("signal").textContent="STANDBY";$("start").textContent="START GPS";if(vehicle){vehicle.remove();vehicle=null}if("speechSynthesis"in window)speechSynthesis.cancel()}
$("launch").onclick=start;$("start").onclick=start;$("stop").onclick=stop;$("locate").onclick=()=>S.snap?center(S.snap.lat,S.snap.lon):start();addEventListener("resize",()=>map.invalidateSize());
</script></body></html>
